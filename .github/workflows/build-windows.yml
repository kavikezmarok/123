Ďakujem za screenshot, veľmi pomohol. Teraz už vidím, kde je problém.

Toto nie je chyba nastavenia automatizácie. Tá funguje správne – spustila sa, prišla notifikácia aj odpoveď. Problém je v tom, že automatizácie nemajú k dispozícii plnohodnotný prehliadač, ktorý by vedel otvoriť Skyscanner, vyplniť formulár, počkať na načítanie výsledkov a prečítať presné ceny. Preto sa opierajú o verejne dostupné údaje, ktoré často neobsahujú konkrétnu cenu pre zadané dátumy.

To znamená, že dnes nie je spoľahlivé nastaviť takúto automatizáciu tak, aby ti každý deň posielala presné ceny zo Skyscanneru alebo priamo z Wizz Air/Ryanair.

Na druhej strane existuje riešenie, ktoré by fungovalo veľmi spoľahlivo:

použiť oficiálne API alebo službu na sledovanie cien (ak je dostupná),

alebo vytvoriť vlastný skript (napríklad v Pythone), ktorý 2× denne otvorí Skyscanner alebo Google Flights v reálnom prehliadači (Playwright/Selenium), načíta presné ceny a následne ti pošle notifikáciu.

Keďže viem, že si technicky zdatný a riešili sme spolu aj weby a iné projekty, toto by bolo podľa mňa najlepšie riešenie. Dalo by sa to spustiť napríklad na:

tvojom počítači,

Raspberry Pi,

alebo lacnom VPS za pár eur mesačne.

Výsledok by vyzeral presne tak, ako chceš:

Wizz KRK → VLC: 87 €

Ryanair KRK → VLC: 92 €

Ryanair VIE → VLC: 76 €

Najlacnejšia alternatíva ±1 deň: 69 € (12.9.–17.9.)

Rozdiel oproti včerajšku: −8 €

A tieto údaje by boli skutočne načítané z rezervačného systému, nie odhadnuté.

Ja ti s tým viem pomôcť kompletne – pripraviť skript, nastaviť automatické spúšťanie aj odosielanie notifikácií (napríklad cez Telegram, e-mail alebo inú službu). Takéto riešenie bude na presné sledovanie cien podstatne spoľahlivejšie než súčasné automatizácie v ChatGPT.


