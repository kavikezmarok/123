name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LetenkyMonitor.sln -r win-x64

      - name: Build
        run: dotnet build LetenkyMonitor/LetenkyMonitor.csproj -c Release -r win-x64 --no-restore

      - name: Locate Playwright script
        id: playwright
        shell: pwsh
        run: |
          $script = Get-ChildItem -Path "LetenkyMonitor\bin\Release" -Filter "playwright.ps1" -Recurse | Select-Object -First 1
          if (-not $script) {
            Write-Error "playwright.ps1 sa po builde nenašiel."
            Get-ChildItem -Path "LetenkyMonitor\bin\Release" -Recurse
            exit 1
          }
          "script=$($script.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Playwright script: $($script.FullName)"

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH="$pwd\pw-browsers"
          & "${{ steps.playwright.outputs.script }}" install chromium

      - name: Publish Windows x64 folder
        shell: pwsh
        run: |
          dotnet publish LetenkyMonitor/LetenkyMonitor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            --no-restore `
            -o publish

          Copy-Item -Recurse -Force pw-browsers publish\pw-browsers

          $driverDir = Get-ChildItem -Path "LetenkyMonitor\bin\Release" -Directory -Filter ".playwright" -Recurse | Select-Object -First 1
          if ($driverDir) {
            Copy-Item -Recurse -Force $driverDir.FullName publish\.playwright
            Write-Host "Copied Playwright driver from $($driverDir.FullName)"
          }

          Get-ChildItem publish -Recurse | Select-Object FullName

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: LetenkyMonitor-Windows
          path: publish
          if-no-files-found: error
