Môj návrh
Keďže plánujeme z toho urobiť väčší projekt, odporúčam úplne zmeniť technológiu:

C# + WPF (.NET 8) ako desktopová aplikácia.

Na build použiť Visual Studio.

Na automatické spúšťanie Windows Task Scheduler.

Na získavanie cien Playwright.

Bude to oveľa stabilnejšie a profesionálnejšie než Python skripty a zároveň sa to bude dať bez problémov nasadiť na váš firemný server.

Myslím, že to je najlepšia cesta na dlhodobý projekt.



Vidím, že .github priečinok stále nie je v repozitári. Najjednoduchšie bude vytvoriť workflow priamo na GitHube.

Klikni hore na Add file.

Vyber Create new file.

Do názvu súboru napíš presne:

.github/workflows/build-windows.yml
Do veľkého poľa vlož toto:

name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Stiahnutie projektu
        uses: actions/checkout@v4

      - name: Inštalácia .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Obnovenie balíkov
        run: dotnet restore LetenkyMonitor.sln

      - name: Build projektu
        run: dotnet build LetenkyMonitor/LetenkyMonitor.csproj -c Release

      - name: Inštalácia Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH="$pwd\pw-browsers"
          pwsh LetenkyMonitor/bin/Release/net8.0-windows/playwright.ps1 install chromium

      - name: Vytvorenie Windows aplikácie
        shell: pwsh
        run: |
          dotnet publish LetenkyMonitor/LetenkyMonitor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o publish

          Copy-Item -Recurse pw-browsers publish/pw-browsers

      - name: Uloženie programu
        uses: actions/upload-artifact@v4
        with:
          name: LetenkyMonitor-Windows
          path: publish
Dole klikni na Commit changes.

Potom otvor kartu Actions.

Naľavo vyber Build Windows EXE.

Klikni Run workflow a ešte raz potvrď zeleným tlačidlom.

Po dokončení sa pri behu zobrazí zelená fajka. Úplne dole bude sekcia Artifacts, odkiaľ stiahneš LetenkyMonitor-Windows.



